name: ExpensesService
version: '3.8'

services:
  db_postgres:
    image: postgres:latest
    container_name: postgres.expenses
    restart: always
    environment:
      POSTGRES_USER: artem
      POSTGRES_PASSWORD: Qq123456
      POSTGRES_DB: expensesdb
      POSTGERS_CONNECTION: Host=postgres.expenses;Port=5432;Database=expensesdb;Username=artem;Password=Qq123456
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin4:
    image: dpage/pgadmin4:latest
    container_name: pgadmin4.expenses
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: Qq123456
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  expenses.api:
    image: ${DOCKER_REGISTRY-}expenses.api
    container_name: service.expenses
    build:
      context: .
      dockerfile: Expenses.API/Dockerfile
    environment: 
      CONNECTION_STRING: Host=postgres;Port=5432;Database=expensesdb;Username=artem;Password=Qq123456
    ports:
      - "8080:8080"

volumes:
  pgdata:
  pgadmin_data: