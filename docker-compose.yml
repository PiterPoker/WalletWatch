services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
    - RabbitMqUser=guest
    - RabbitMqPassword=guest
    - RabbitMqVhost=/
    ports:
      - "5673:5672"
      - "15673:15672"
    networks:
      app-network:
        ipv4_address: 172.18.0.11
    healthcheck:
        test: ["CMD", "rabbitmq-diagnostics", "ping"]
        interval: 30s
        retries: 5
    restart: always

  redis:
    image: redis:latest
    container_name: redis.authwalletwatch
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      app-network:
        ipv4_address: 172.18.0.10

  family.postgres:
    image: postgres:15-alpine
    container_name: postgres.family
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=FamilyDb
    ports:
       - "5433:5432"
    volumes:
      - family_pgdata:/var/lib/postgresql/data
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres -d FamilyDb"]
        interval: 30s
        retries: 5
    networks:
      app-network:
        ipv4_address: 172.18.0.9

  wallet.postgres:
    image: postgres:15-alpine
    container_name: postgres.wallet
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: WalletDb
    ports:
      - "5434:5432"
    volumes:
      - wallet_pgdata:/var/lib/postgresql/data
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres -d WalletDb"]
        interval: 30s
        retries: 5
    networks:
      app-network:
        ipv4_address: 172.18.0.8

  expences.postgres:
    image: postgres:15-alpine
    container_name: postgres.expences
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ExpencesDb
    ports:
      - "5435:5432"
    volumes:
      - expences_pgdata:/var/lib/postgresql/data
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres -d ExpencesDb"]
        interval: 30s
        retries: 5
    networks:
      app-network:
        ipv4_address: 172.18.0.7
        
  
  auth.postgres:
    image: postgres:15-alpine
    container_name: postgres.auth
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=AuthDb
    ports:
      - "5436:5432"
    volumes:
      - auth_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d AuthDb"]
      interval: 30s
      retries: 5
    networks:
      app-network:
        ipv4_address: 172.18.0.6

  family.api:
    image: ${DOCKER_REGISTRY-}family.api
    build:
      context: .
      dockerfile: src/FamilyMicroservice/Family.API/Dockerfile
    depends_on:
      rabbitmq:
            condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - CONNECTION_STRING=Host=family.postgres;Port=5432;Database=FamilyDb;Username=postgres;Password=postgres
      - RabbitMqHost=rabbitmq
      - RabbitMqPort=5672
      - RabbitMqUser=guest
      - RabbitMqPassword=guest
      - ASPNETCORE_URLS=http://0.0.0.0:80
    ports:
      - "5200:80"
    networks:
      app-network:
        ipv4_address: 172.18.0.5

  wallet.api:
    image: ${DOCKER_REGISTRY-}wallet.api
    build:
      context: .
      dockerfile: src/Wallet/Wallet.API/Dockerfile
    environment: 
      - CONNECTION_STRING=Host=wallet.postgres;Port=5432;Database=WalletDb;Username=postgres;Password=postgres
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:80
    ports:
      - "5300:80"
    depends_on:
      rabbitmq:
        condition: service_healthy
      wallet.postgres:
        condition: service_healthy 
    networks:
      app-network:
        ipv4_address: 172.18.0.4
  
  expences.api:
    image: ${DOCKER_REGISTRY-}expences.api
    build:
      context: .
      dockerfile: src/Expenses/Expenses.API/Dockerfile
    environment: 
      - ASPNETCORE_ENVIRONMENT=Development
      - CONNECTION_STRING=Host=expences.postgres;Port=5432;Database=ExpencesDb;Username=postgres;Password=postgres
      - ASPNETCORE_URLS=http://0.0.0.0:80
    ports:
      - "5400:80"
    depends_on:
      rabbitmq:
        condition: service_healthy
      expences.postgres:
        condition: service_healthy 
    networks:
      app-network:
        ipv4_address: 172.18.0.3

  auth.api:
    image: ${DOCKER_REGISTRY-}api.auth
    build:
      context: .
      dockerfile: src/AuthWalletWatch/AuthWalletWatch.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - CONNECTION_STRING=Host=auth.postgres;Port=5432;Database=AuthDb;Username=postgres;Password=postgres
      - CONNECTION_STRING_REDIS=redis:6379
      - ASPNETCORE_URLS=http://0.0.0.0:80
    ports:
      - "5500:80"
    depends_on:
      rabbitmq:
        condition: service_healthy
      auth.postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      app-network:
        ipv4_address: 172.18.0.2
  
  apigateway:
    build:
      context: .
      dockerfile: src/ApiGateway/Dockerfile
    ports:
      - "50500:8080"
    depends_on:
      - wallet.api
      - auth.api
      - family.api
      - expences.api
    extra_hosts:
      - "AuthWalletWatch.API:172.18.0.2"
      - "Expenses.API:172.18.0.3"
      - "Wallet.API:172.18.0.4"
      - "Family.API:172.18.0.5"
    networks:
      app-network:
        ipv4_address: 172.18.0.12
  
volumes:
  family_pgdata:
  wallet_pgdata:
  expences_pgdata:
  auth_pgdata:
  redis-data:

networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/24